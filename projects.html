<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boya Zhang | Projects</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="starbar">
    <nav class="nav container">
      <h1 class="logo"><a href="index.html">Boya Zhang</a></h1>
  
      <input type="checkbox" id="nav-toggle" class="nav__checkbox" />
      <label for="nav-toggle" class="nav__toggle" aria-label="Menu">&#9776;</label>
  
      <ul class="nav__links">
        <li><a href="index.html">Home</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="cv.html">CV</a></li>
      </ul>
    </nav>
  </div>

  <section class="section section--alt">
    <div class="container">
      <h3 class="section__title">Featured Projects</h3>
      <div class="projects__grid" id="projects-grid"></div>
    </div>
  </section>

  <footer class="footer summer">
    <p>&copy; <span id="year"></span> Boya Zhang. All rights reserved.</p>
    <ul class="social">
      <li><a href="https://github.com/BoyaZhangNB">GitHub</a></li>
      <li><a href="https://www.linkedin.com/in/boya-zhang-380a842b0/">Linkedin</a></li>
      <li><a href="mailto:harvardboya@gmail.com">Email</a></li>
    </ul>
  </footer>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    const projectsGrid = document.getElementById("projects-grid");
    let sortedProjects = [];

    function getNodeText(parent, tagName) {
      const node = parent.querySelector(tagName);
      return node ? node.textContent.trim() : "";
    }

    function createProjectCard(project) {
      const article = document.createElement("article");
      article.className = "card";

      const imgWrap = document.createElement("div");
      imgWrap.className = "card__img-wrap";
      const imgInner = document.createElement("div");
      imgInner.className = "card__img-inner";
      if (project.img) {
        const image = document.createElement("img");
        image.src = project.img;
        image.alt = project.title;
        image.loading = "lazy";
        image.onerror = () => {
          imgInner.innerHTML = "";
        };
        imgInner.appendChild(image);
      }
      imgWrap.appendChild(imgInner);

      if (project.tag) {
        const tag = document.createElement("span");
        tag.className = "card__img-tag";
        tag.textContent = project.tag;
        imgWrap.appendChild(tag);
      }

      const content = document.createElement("div");
      content.className = "card__content";

      if (project.date) {
        const dateEl = document.createElement("p");
        dateEl.className = "card__date";
        dateEl.textContent = new Date(project.date).getFullYear();
        content.appendChild(dateEl);
      }

      const title = document.createElement("h4");
      title.textContent = project.title;

      const description = document.createElement("p");
      description.textContent = project.description;

      const footer = document.createElement("div");
      footer.className = "card__footer";

      const link = document.createElement("a");
      link.href = project.link;
      link.className = "btn--link";
      link.textContent = "Learn more \u2192";
      footer.appendChild(link);

      content.appendChild(title);
      content.appendChild(description);
      content.appendChild(footer);

      article.appendChild(imgWrap);
      article.appendChild(content);

      return article;
    }

    function getProjectColumnCount() {
      if (window.matchMedia("(min-width: 980px)").matches) {
        return 3;
      }
      if (window.matchMedia("(min-width: 600px)").matches) {
        return 2;
      }
      return 1;
    }

    function renderProjectGrid(projects) {
      const columnCount = getProjectColumnCount();
      const columns = Array.from({ length: columnCount }, () => {
        const column = document.createElement("div");
        column.className = "projects__column";
        return column;
      });

      projects.forEach((project, index) => {
        const targetColumn = index % columnCount;
        columns[targetColumn].appendChild(createProjectCard(project));
      });

      projectsGrid.innerHTML = "";
      columns.forEach((column) => {
        projectsGrid.appendChild(column);
      });
    }

    async function renderProjects() {
      try {
        const response = await fetch("data/project.xml");
        if (!response.ok) {
          throw new Error("Failed to load project.xml");
        }

        const xmlText = await response.text();
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "application/xml");

        const parserError = xmlDoc.querySelector("parsererror");
        if (parserError) {
          throw new Error("Invalid XML format in project.xml");
        }

        const projects = Array.from(xmlDoc.querySelectorAll("project")).map((projectNode) => ({
          title: getNodeText(projectNode, "title"),
          img: getNodeText(projectNode, "img"),
          description: getNodeText(projectNode, "description"),
          link: getNodeText(projectNode, "link"),
          date: getNodeText(projectNode, "date"),
          tag: getNodeText(projectNode, "tag")
        }));

        sortedProjects = projects.sort((a, b) => new Date(b.date) - new Date(a.date));
        renderProjectGrid(sortedProjects);
      } catch (error) {
        projectsGrid.innerHTML = "<p>Unable to load projects right now.</p>";
        console.error(error);
      }
    }

    window.addEventListener("resize", () => {
      if (sortedProjects.length > 0) {
        renderProjectGrid(sortedProjects);
      }
    });

    renderProjects();
  </script>
</body>
</html>
